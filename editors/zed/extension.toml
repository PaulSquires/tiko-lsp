id = "tiko-lsp"
name = "Tiko"
version = "0.1.0"
schema_version = 1
description = "Language support for tiko, served by tiko-lsp."
repository = "https://github.com/PaulSquires/tiko-lsp"
authors = ["Paul Squires"]

# The grammar is named by REPOSITORY AND REVISION -- never by a local path.
# A `file://` URL is how a grammar is loaded from the filesystem while it is
# being developed; swap in the GitHub URL once the grammar is published, and
# change the rev with it.
[grammars.tiko]
repository = "file:///C:/dev/tiko-tree-sitter"
rev = "b2d36e881fc231d6f7f66a3a20372630f1d726f9"

[language_servers.tiko-lsp]
name = "tiko-lsp"
languages = ["Tiko"]
